<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="robotMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="32"/>
  
  <!-- Cyber Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Antenna -->
  <line x1="200" y1="90" x2="200" y2="50" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="45" r="12" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="200" cy="45" r="6" fill="#ffffff"/>

  <!-- Robot Head Base -->
  <rect x="90" y="90" width="220" height="200" rx="48" fill="url(#robotMetal)"/>
  
  <!-- Head Inner Plate -->
  <rect x="105" y="105" width="190" height="170" rx="36" fill="#1e293b"/>

  <!-- Holographic Visor -->
  <rect x="120" y="145" width="160" height="55" rx="16" fill="url(#visorGrad)" filter="url(#glow)"/>
  
  <!-- Glowing Eye Scanners -->
  <circle cx="160" cy="172" r="12" fill="#ffffff"/>
  <circle cx="160" cy="172" r="6" fill="#06b6d4"/>
  <circle cx="240" cy="172" r="12" fill="#ffffff"/>
  <circle cx="240" cy="172" r="6" fill="#06b6d4"/>
  
  <!-- Visor HUD lines -->
  <line x1="130" y1="172" x2="140" y2="172" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="260" y1="172" x2="270" y2="172" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Cyber Ears / Side Nodes -->
  <rect x="68" y="160" width="22" height="60" rx="8" fill="#475569"/>
  <rect x="74" y="175" width="10" height="30" rx="4" fill="#06b6d4" opacity="0.8"/>
  <rect x="310" y="160" width="22" height="60" rx="8" fill="#475569"/>
  <rect x="316" y="175" width="10" height="30" rx="4" fill="#06b6d4" opacity="0.8"/>

  <!-- Mouth / Audio Grille -->
  <rect x="150" y="230" width="100" height="18" rx="9" fill="#0f172a"/>
  <circle cx="165" cy="239" r="3" fill="#38bdf8"/>
  <circle cx="180" cy="239" r="3" fill="#38bdf8"/>
  <circle cx="195" cy="239" r="3" fill="#38bdf8"/>
  <circle cx="210" cy="239" r="3" fill="#38bdf8"/>
  <circle cx="225" cy="239" r="3" fill="#38bdf8"/>
  <circle cx="235" cy="239" r="3" fill="#38bdf8"/>

  <!-- Shoulders & Torso -->
  <path d="M120 310 C120 295, 280 295, 280 310 L340 400 L60 400 Z" fill="url(#robotMetal)"/>
  <path d="M140 330 C140 315, 260 315, 260 330 L310 400 L90 400 Z" fill="#1e293b"/>
  <!-- Core Arc Reactor -->
  <circle cx="200" cy="365" r="22" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="200" cy="365" r="14" fill="#ffffff"/>
</svg>
