<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021f18"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sysBg)" rx="32"/>

  <!-- Circuit Trace Grid -->
  <g stroke="#047857" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M50 50 L120 50 L150 80 L150 150"/>
    <path d="M350 50 L280 50 L250 80 L250 150"/>
    <path d="M50 350 L120 350 L150 320 L150 250"/>
    <path d="M350 350 L280 350 L250 320 L250 250"/>
    <circle cx="120" cy="50" r="4" fill="#10b981"/>
    <circle cx="280" cy="50" r="4" fill="#10b981"/>
    <circle cx="120" cy="350" r="4" fill="#10b981"/>
    <circle cx="280" cy="350" r="4" fill="#10b981"/>
  </g>

  <!-- Central Ambient Energy Field -->
  <circle cx="200" cy="200" r="130" fill="#10b981" opacity="0.12" filter="url(#emeraldGlow)"/>

  <!-- Outer Server Chassis Ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="100" fill="url(#nodeGrad)" stroke="#334155" stroke-width="3"/>

  <!-- System Server Rack Nodes Stack -->
  <g transform="translate(130, 130)">
    <!-- Rack 1 (Top) -->
    <rect x="0" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#emeraldGlow)"/>
    <circle cx="34" cy="17" r="4" fill="#06b6d4"/>
    <rect x="50" y="14" width="70" height="6" rx="3" fill="#334155"/>
    <circle cx="125" cy="17" r="3" fill="#10b981"/>

    <!-- Rack 2 (Middle - Active Core) -->
    <rect x="0" y="44" width="140" height="48" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#emeraldGlow)"/>
    <circle cx="22" cy="68" r="7" fill="#10b981"/>
    <circle cx="22" cy="68" r="3" fill="#ffffff"/>
    <!-- CPU Activity Bars -->
    <rect x="42" y="60" width="8" height="16" rx="2" fill="#10b981"/>
    <rect x="54" y="55" width="8" height="26" rx="2" fill="#10b981"/>
    <rect x="66" y="63" width="8" height="13" rx="2" fill="#10b981"/>
    <rect x="78" y="52" width="8" height="32" rx="2" fill="#34d399"/>
    <rect x="90" y="58" width="8" height="20" rx="2" fill="#10b981"/>
    <rect x="102" y="65" width="8" height="9" rx="2" fill="#059669"/>
    <circle cx="125" cy="68" r="4" fill="#38bdf8"/>

    <!-- Rack 3 (Bottom) -->
    <rect x="0" y="102" width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="18" cy="119" r="5" fill="#10b981" filter="url(#emeraldGlow)"/>
    <circle cx="34" cy="119" r="4" fill="#06b6d4"/>
    <rect x="50" y="116" width="70" height="6" rx="3" fill="#334155"/>
    <circle cx="125" cy="119" r="3" fill="#10b981"/>
  </g>

  <!-- Glowing Connection Data Lines -->
  <g stroke="#10b981" stroke-width="2" opacity="0.8">
    <line x1="200" y1="50" x2="200" y2="80"/>
    <line x1="200" y1="320" x2="200" y2="350"/>
    <line x1="50" y1="200" x2="80" y2="200"/>
    <line x1="320" y1="200" x2="350" y2="200"/>
  </g>

  <!-- Orbiting Node Dots -->
  <circle cx="200" cy="50" r="7" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="200" cy="350" r="7" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="50" cy="200" r="7" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="350" cy="200" r="7" fill="#34d399" filter="url(#emeraldGlow)"/>
</svg>
