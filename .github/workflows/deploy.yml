name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      POSTBASE_URL: ${{ secrets.POSTBASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pmos-ui/package-lock.json

      - name: Setup PostgreSQL
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: "16"
          postgresql db: "postbase"
          postgresql user: "postgres"
          postgresql password: "postgres"

      - name: Install PostBase dependencies
        run: |
          cd postbase/backend
          npm ci

      - name: Start PostBase backend
        run: |
          cd postbase/backend
          npm run start:local &
          sleep 10

      - name: Install PMOS UI dependencies
        run: |
          cd pmos-ui
          npm ci

      - name: Build PMOS UI
        run: |
          cd pmos-ui
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pmos-ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4